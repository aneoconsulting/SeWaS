name: Linux

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: build (linux)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: install dependencies
      run : |
          sudo apt-get install libboost-program-options-dev
          sudo apt-get install libopenmpi-dev openmpi-common
          sudo apt-get install libeigen3-dev
          sudo apt-get install libspdlog-dev

    - name: bootstrap
      run: . bootstrap.sh

    - name: configure
      run: mkdir build && cd build && cmake .. -DBUILD_TESTING=ON -DCOLLECT_STATS=ON -DSEWAS_DISTRIBUTED=ON -DSEWAS_WITH_STARPU=ON -DVERBOSE=ON && cd -
    - name: build
      run: cmake --build build --config Release
      
    - name: test
      run: cd build && ctest -C Release --output-on-failure -V
